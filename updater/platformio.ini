; ThinkKira Updater – kleines eigenes Programm für die 640-KB-Partition „flashApp“ (ota_1).
; Lädt die neueste ThinkKira-Firmware per WLAN aus dem GitHub-Release und schreibt sie in die App-Partition.
; Bauen: pio run -d updater  →  .pio/build/updater/firmware.bin (gehört an 0x260000)
[env:updater]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ../partition-table.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
