# ThinkKira: Release bauen, sobald ein Tag v* gepusht wird (z. B. v0.1.0).
# Hängt Firmware, manifest.json (für den Web-Flasher) und web.zip (Einbau devsven.de) an das Release.
name: ThinkKira Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/esp32/esp32-common.ini', 'variants/esp32s3/esp32s3.ini', 'variants/esp32s3/ThinkKira-M5/platformio.ini') }}
      - name: PlatformIO installieren
        run: |
          pip install -r .github/actions/setup-base/requirements.txt
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install "pioarduino==6.2.0"
      - name: Firmware bauen
        run: pio run -e thinknode_m5_custom
      - name: Updater bauen
        run: pio run -d updater && test $(stat -c %s updater/.pio/build/updater/firmware.bin) -le 655360
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Loader und Konfigurator bauen
        run: cd web/config && npm ci --ignore-scripts && npm run build
      - name: Release-Dateien zusammenstellen
        run: |
          mkdir -p dist
          B=.pio/build/thinknode_m5_custom
          # Werksabbild = ThinkKira + Updater in „flashApp“ (0x260000), damit das Gerät sich später selbst aktualisieren kann
          python3 - "$(ls $B/firmware-thinknode_m5_custom-*.factory.bin | head -1)" updater/.pio/build/updater/firmware.bin dist/thinkkira-m5.factory.bin <<'PY'
          import sys
          fw = open(sys.argv[1], "rb").read()
          up = open(sys.argv[2], "rb").read()
          assert len(fw) <= 0x260000 and len(up) <= 0xA0000
          open(sys.argv[3], "wb").write(fw + b"\xff" * (0x260000 - len(fw)) + up)
          PY
          cp updater/.pio/build/updater/firmware.bin dist/thinkkira-updater.bin
          cp $(ls $B/firmware-thinknode_m5_custom-*.bin | grep -v factory | head -1) dist/thinkkira-m5.bin
          VERSION="${TAG#v}"
          cat > dist/manifest.json <<JSON
          {
            "name": "ThinkKira (ThinkNode M5)",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [{ "path": "firmware.php?asset=thinkkira-m5.factory.bin", "offset": 0 }]
              }
            ]
          }
          JSON
          cp web/config/dist/thinkkira-config.js web/config/dist/thinkkira-config.css web/config/dist/thinkkira-loader.js web/config/dist/thinkkira-loader.css web/config/dist/thinkkira-designer.js web/config/dist/thinkkira-designer.html web/config/dist/thinkkira-map.js web/config/dist/thinkkira-map.html dist/
          (cd web && zip -r ../dist/thinkkira-web.zip . -x "*/node_modules/*")
          ls -la dist
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* --title "ThinkKira $TAG" --generate-notes || \
          gh release upload "$TAG" dist/* --clobber
