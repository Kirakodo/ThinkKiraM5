# ThinkKira: baut die eigene Firmware bei jedem Push/PR.
# Die Meshtastic-Workflows wurden entfernt (bauen >100 Boards und brauchen Secrets).
name: ThinkKira Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/esp32/esp32-common.ini', 'variants/esp32s3/esp32s3.ini', 'variants/esp32s3/ThinkKira-M5/platformio.ini') }}
      - name: PlatformIO installieren
        run: |
          pip install -r .github/actions/setup-base/requirements.txt
          # pioarduino 6.2.0.post1 gilt fuer die eigene Plattform-Pruefung als < 6.2.0
          # ("not compatible with PlatformIO Core v6.2.0-post.1"). Darum 6.2.0 vorab ins penv.
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install "pioarduino==6.2.0"
      - name: Firmware bauen
        run: pio run -e thinknode_m5_custom
      - name: Updater bauen (muss in 640 KB passen)
        run: |
          pio run -d updater
          ls -l updater/.pio/build/updater/firmware.bin
          test $(stat -c %s updater/.pio/build/updater/firmware.bin) -le 655360
      - name: Firmware als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: thinkkira-firmware
          path: |
            .pio/build/thinknode_m5_custom/firmware*.bin
            .pio/build/thinknode_m5_custom/firmware*.factory.bin
            updater/.pio/build/updater/firmware.bin
          if-no-files-found: warn
