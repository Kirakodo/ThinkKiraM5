# ThinkKira: baut die eigene Firmware bei jedem Push/PR.
# Die Meshtastic-Workflows wurden entfernt (bauen >100 Boards und brauchen Secrets).
name: ThinkKira Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/esp32/esp32-common.ini', 'variants/esp32s3/esp32s3.ini', 'variants/esp32s3/ThinkKira-M5/platformio.ini') }}
      - name: PlatformIO installieren
        run: pip install -r .github/actions/setup-base/requirements.txt
      - name: Firmware bauen
        run: pio run -e thinknode_m5_custom
      - name: Firmware als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: thinkkira-firmware
          path: |
            .pio/build/thinknode_m5_custom/firmware*.bin
            .pio/build/thinknode_m5_custom/firmware*.factory.bin
          if-no-files-found: warn
