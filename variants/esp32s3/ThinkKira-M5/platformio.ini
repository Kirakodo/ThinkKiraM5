; ThinkKira – eigene Firmware für das Elecrow ThinkNode M5
; Basiert auf der InkHUD-Env von Meshtastic (variants/esp32s3/ELECROW-ThinkNode-M5).
; Eigene Funktionen: src/custom/, abschaltbar per -DCUSTOM_FEATURE_xxx=0 (siehe src/custom/features.h)

[env:thinknode_m5_custom]
extends = esp32s3_base, inkhud
board_level = extra
board = ESP32-S3-WROOM-1-N4
custom_meshtastic_hw_model = 107
custom_meshtastic_hw_model_slug = THINKNODE_M5
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = ThinkKira (ThinkNode M5)
build_flags =
  ${esp32s3_base.build_flags}
  ${inkhud.build_flags}
  ; eigener Ordner zuerst, damit unsere nicheGraphics.h die von Meshtastic ersetzt
  -I variants/esp32s3/ThinkKira-M5
  -I variants/esp32s3/ELECROW-ThinkNode-M5
  -D ELECROW_ThinkNode_M5
  -D THINKKIRA=1
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
build_src_filter =
  ${esp32s3_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/esp32s3/ELECROW-ThinkNode-M5>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=PCA9557-arduino packageName=maxpromer/library/PCA9557-arduino
  maxpromer/PCA9557-arduino@1.0.0
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip
